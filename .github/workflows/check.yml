name: Check

on:
  push:
    branches: [main, dev]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate build and syntax

    steps:
      - uses: actions/checkout@v6

      - name: Install readline (needed to build Lua via mise)
        run: sudo apt-get install -y libreadline-dev

      - name: Cache mise tools
        uses: actions/cache@v5
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-${{ runner.os }}-

      - uses: jdx/mise-action@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Build smoke test
        run: make build VERSION=DEV

      - name: Verify build artifacts
        run: make verify VERSION=DEV

      - name: Check no {{VERSION}} placeholders remain in dist/
        run: |
          if grep -rq '{{VERSION}}' dist/ 2>/dev/null; then
            echo "ERROR: {{VERSION}} placeholder found in dist/ after build"
            grep -rn '{{VERSION}}' dist/
            exit 1
          fi
          echo "✓ No unsubstituted placeholders"

      - name: Validate Lua syntax (all files)
        run: |
          find src/ -name '*.lua' | sort | while read f; do
            luac -p "$f" && echo "  ✓ $f"
          done
          echo "✓ All Lua files passed syntax check"

      - name: Validate Python syntax (all files)
        run: |
          find src/ -name '*.py' | sort | while read f; do
            python3 -m py_compile "$f" && echo "  ✓ $f"
          done
          echo "✓ All Python files passed syntax check"

      - name: Run Python tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -v

      - name: Build C++ extension + unit tests
        run: |
          cmake -S src/extension -B src/extension/build -DCMAKE_BUILD_TYPE=Release -DREATC_BUILD_TESTS=ON
          cmake --build src/extension/build --config Release
          echo "✓ C++ extension compiled successfully"

      - name: Run C++ unit tests
        run: ctest --test-dir src/extension/build -C Release --output-on-failure

  extension:
    # Same runners as release.yml, so platform-specific extension code
    # (Winsock / winmm / MSVC, macOS getifaddrs, deployment target) is
    # compiled and tested on every PR, not first at release time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            name: macOS arm64
          - os: macos-15-intel    # Intel
            name: macOS x86_64
          - os: windows-latest
            name: Windows x64
    runs-on: ${{ matrix.os }}
    name: Extension (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v6

      - name: Build C++ extension + unit tests
        shell: bash
        run: |
          cmake -S src/extension -B src/extension/build -DCMAKE_BUILD_TYPE=Release -DREATC_BUILD_TESTS=ON -DREATC_VERSION=DEV
          cmake --build src/extension/build --config Release

      - name: Run C++ unit tests
        shell: bash
        run: ctest --test-dir src/extension/build -C Release --output-on-failure

      - name: Check macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source build/platforms.env
          lib=src/extension/build/reaper_reatc.dylib
          minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          # Apple Silicon cannot target below 11.0; the linker raises it.
          expected=$MACOS_DEPLOYMENT_TARGET
          if [ "$(uname -m)" = "arm64" ]; then
            expected=$(printf '%s\n11.0\n' "$MACOS_DEPLOYMENT_TARGET" | sort -V | tail -1)
          fi
          echo "minos=$minos expected=$expected"
          [ "$minos" = "$expected" ] || { echo "ERROR: deployment target $minos, expected $expected"; exit 1; }
          nm -gU "$lib" | grep -q ' _ReaperPluginEntry$' || { echo "ERROR: ReaperPluginEntry not exported"; exit 1; }
          echo "✓ minos $minos, ReaperPluginEntry exported"

      - name: Check Windows DLL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dll=src/extension/build/Release/reaper_reatc64.dll
          test -f "$dll" || { echo "ERROR: $dll not built"; exit 1; }
          echo "✓ $dll built"
